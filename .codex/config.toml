[mcp_servers.serena]
command = "oma"
args = [ "bridge", "--context", "oma" ]
startup_timeout_sec = 90

[mcp_servers.serena.env]
SERENA_LOG_LEVEL = "info"

[mcp_servers.firefox-devtools]
command = "npx"
args = [ "-y", "@mozilla/firefox-devtools-mcp@latest", "--autoProfile" ]

[features]
goals = true

[analytics]
enabled = false

[feedback]
enabled = false

