# PDF Injection — local/dev-parity Docker Compose stack (api + web).
#
# Not executed by any agent per CLAUDE.md ("NEVER build the software until
# the user explicitly asks for a build"). Syntax-validated with
# `docker compose config` only; `docker compose up` is left to the user.
#
# Usage (once the user chooses to run it):
#   docker compose up --build
#   API:  http://localhost:3001/api/v1/health
#   Web:  http://localhost:5173/
#
# All secrets/keys below default to empty and external providers stay
# disabled (PDFI_ALLOW_EXTERNAL_PROVIDERS=false) unless explicitly overridden
# via a local `.env` file (never commit one) or the shell environment.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: pdf-injection-api:local
    ports:
      - "${PDFI_PORT:-3001}:3001"
    environment:
      # --- Round 1 limits/paths (see apps/api/.env.example) ---
      PDFI_MAX_FILE_BYTES: "${PDFI_MAX_FILE_BYTES:-26214400}"
      PDFI_MAX_PAGES: "${PDFI_MAX_PAGES:-100}"
      PDFI_MAX_INSTRUCTION_CHARS: "${PDFI_MAX_INSTRUCTION_CHARS:-1500}"
      PDFI_RETENTION_HOURS: "${PDFI_RETENTION_HOURS:-24}"
      PDFI_STORAGE_DIR: /app/data
      PDFI_DB_PATH: /app/data/pdf-injection.sqlite
      PDFI_QPDF_ENABLED: "${PDFI_QPDF_ENABLED:-false}"
      PDFI_MAX_PAGE_DIMENSION_PT: "${PDFI_MAX_PAGE_DIMENSION_PT:-14400}"
      PDFI_CORS_ORIGIN: "${PDFI_CORS_ORIGIN:-http://localhost:5173}"
      PDFI_SWEEP_INTERVAL_MS: "${PDFI_SWEEP_INTERVAL_MS:-600000}"
      PDFI_PORT: "3001"
      # --- Round 2 §0.2: providers / research mode (default OFF) ---
      PDFI_ALLOW_EXTERNAL_PROVIDERS: "${PDFI_ALLOW_EXTERNAL_PROVIDERS:-false}"
      PDFI_RESEARCH_MODE: "${PDFI_RESEARCH_MODE:-false}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      PDFI_ANTHROPIC_MODEL: "${PDFI_ANTHROPIC_MODEL:-claude-opus-5}"
      PDFI_OPENAI_MODEL: "${PDFI_OPENAI_MODEL:-gpt-5.5}"
      PDFI_MAX_PROCESSING_MS: "${PDFI_MAX_PROCESSING_MS:-60000}"
      PDFI_MAX_VARIANTS: "${PDFI_MAX_VARIANTS:-8}"
      PDFI_MAX_STUDENT_KEYS: "${PDFI_MAX_STUDENT_KEYS:-500}"
      PDFI_MODEL_TEST_MAX_REPEATS: "${PDFI_MODEL_TEST_MAX_REPEATS:-10}"
      PDFI_MODEL_TEST_CONCURRENCY: "${PDFI_MODEL_TEST_CONCURRENCY:-2}"
      PDFI_FONT_DIR: "${PDFI_FONT_DIR:-packages/pdf-engine/fonts}"
      # Optional: copy model-test exports into research/results/ (unset = off).
      PDFI_RESEARCH_RESULTS_DIR: "${PDFI_RESEARCH_RESULTS_DIR:-}"
    volumes:
      - pdf-injection-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: pdf-injection-web:local
    ports:
      - "${PDFI_WEB_PORT:-5173}:80"
    environment:
      PDFI_API_PROXY_TARGET: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pdf-injection-data:
